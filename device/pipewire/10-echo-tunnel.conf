context.properties = {
    default.clock.rate = 44100
    default.clock.allowed-rates = [ 44100 48000 ]
    support.dbus = false
}

context.modules = [
    {   name = libpipewire-module-pulse-tunnel
        args = {
            tunnel.mode = sink
            pulse.server.address = "tcp:127.0.0.1:4713"
            audio.rate = 44100
            audio.channels = 2
            audio.position = [ FL FR ]
            pulse.latency = 200
            stream.props = {
                node.name = "echo_speaker"
                node.description = "Echo Show speaker"
                priority.session = 2000
            }
        }
    }
]
